<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PesaWave</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: var(--shadow-card);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-activation-note {
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.3);
      color: var(--accent-cyan);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <div class="logo-container">
        <a href="/index.html" style="text-decoration:none; display:inline-flex; flex-direction:column; align-items:center; gap:0.5rem;">
          <img src="/logo.png" alt="PesaWave Logo" style="height:64px; width:auto; max-width:200px; object-fit:contain; border-radius:12px; margin-bottom:0.25rem;">
          <div class="logo">PesaWave</div>
        </a>
        <p class="text-secondary mt-1">Create your earner account</p>
      </div>

      <div class="badge-activation-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Fresh accounts start at KES 0.00. Requires one-time KES 5 activation via PayHero to unlock all earning tasks.</span>
      </div>
      
      <form id="registerForm">
        <div id="globalError" class="form-error text-center mb-4" style="display:none; color:var(--danger); background:rgba(248,81,73,0.1); padding:0.75rem; border-radius:6px; font-size:0.88rem;"></div>
        
        <div class="form-group mb-3">
          <label class="form-label" for="fullName" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Full Name</label>
          <input type="text" id="fullName" class="form-control" required placeholder="John Doe" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="username" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Username</label>
          <input type="text" id="username" class="form-control" required pattern="[a-zA-Z0-9_]{3,20}" title="3-20 characters, alphanumeric and underscore" placeholder="johndoe" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>
        
        <div class="form-group mb-3">
          <label class="form-label" for="email" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="you@example.com" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="phone" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">M-Pesa Phone Number</label>
          <input type="tel" id="phone" class="form-control" required placeholder="07XXXXXXXX or 2547XXXXXXXX" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
          <small class="text-muted" style="font-size: 0.75rem; display:block; margin-top:0.25rem; color:var(--text-muted);">Used for PayHero activation and M-Pesa withdrawals</small>
        </div>
        
        <div class="form-group mb-3">
          <label class="form-label" for="password" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Password (Min. 6 chars)</label>
          <input type="password" id="password" class="form-control" required minlength="6" placeholder="Create a secure password" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>

        <div class="form-group mb-4">
          <label class="form-label" for="confirmPassword" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" required minlength="6" placeholder="Repeat password" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding:0.85rem; font-size:1rem; font-weight:600; cursor:pointer;" id="registerBtn">
          <span class="btn-text">Create Account & Proceed to Activation</span>
          <div class="spinner hidden" id="registerSpinner" style="display:none;">Creating account...</div>
        </button>
      </form>
      
      <div class="text-center mt-4" style="margin-top:1.5rem; text-align:center; font-size:0.9rem;">
        <span class="text-secondary">Already have an account?</span>
        <a href="/login.html" style="color:var(--accent-green); font-weight:600; text-decoration:none; margin-left:0.25rem;">Log In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { registerUser } from './js/auth.js';
    import { normalizePhone } from './js/config.js';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('globalError');
      const submitBtn = document.getElementById('registerBtn');
      const btnText = document.querySelector('.btn-text');
      const spinner = document.getElementById('registerSpinner');
      
      if (password !== confirmPassword) {
        if (errorDiv) {
          errorDiv.textContent = 'Passwords do not match.';
          errorDiv.style.display = 'block';
        }
        return;
      }

      const userData = {
        fullName: document.getElementById('fullName')?.value?.trim() || '',
        username: document.getElementById('username')?.value?.trim().toLowerCase() || '',
        email: document.getElementById('email')?.value?.trim() || '',
        phone: normalizePhone(document.getElementById('phone')?.value?.trim() || ''),
        password: password
      };
      
      if (btnText) btnText.style.display = 'none';
      if (spinner) spinner.style.display = 'inline-block';
      if (errorDiv) errorDiv.style.display = 'none';
      if (submitBtn) submitBtn.disabled = true;
      
      try {
        await registerUser(userData);
        // After registration, redirect immediately to activation page!
        window.location.href = '/activation.html';
      } catch (err) {
        if (errorDiv) {
          errorDiv.textContent = err.message || 'Registration failed. Please check details.';
          errorDiv.style.display = 'block';
        }
        if (btnText) btnText.style.display = 'inline-block';
        if (spinner) spinner.style.display = 'none';
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
