<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - EARNWAVE</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container">
    <h2 class="mb-4">My Profile</h2>
    
    <div class="card mb-4">
      <div class="d-flex align-items-center flex-wrap" style="gap: 2rem;">
        <div class="avatar" style="width: 100px; height: 100px; font-size: 2.5rem;" id="profileAvatar">U</div>
        <div style="flex: 1;">
          <div class="d-flex align-items-center mb-2">
            <h3 style="margin: 0; margin-right: 1rem;" id="profileName">Loading...</h3>
            <span class="badge badge-success" id="profileStatus">ACTIVE</span>
          </div>
          <p class="text-secondary mb-1">@<span id="profileUsername">...</span></p>
          <p class="text-secondary mb-1" style="display:flex; align-items:center; gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span id="profileEmail">...</span>
          </p>
          <p class="text-secondary mb-3" style="display:flex; align-items:center; gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span id="profilePhone">...</span>
          </p>
          <button class="btn btn-secondary btn-sm">Edit Profile</button>
        </div>
      </div>
    </div>

    <div class="d-flex" style="gap: 1.5rem; flex-wrap: wrap;">
      <div class="card flex-1" style="min-width: 250px;">
        <h4 class="text-secondary">Lifetime Earned</h4>
        <h2 class="mt-2 text-success" id="statEarned">KES 0.00</h2>
      </div>
      <div class="card flex-1" style="min-width: 250px;">
        <h4 class="text-secondary">Tasks Completed</h4>
        <h2 class="mt-2" id="statTasks">0</h2>
      </div>
      <div class="card flex-1" style="min-width: 250px;">
        <h4 class="text-secondary">Referral Earnings</h4>
        <h2 class="mt-2 text-warning" id="statReferrals">KES 0.00</h2>
      </div>
    </div>

    <div class="card mt-4">
      <h3 class="mb-4">Security</h3>
      <div class="form-group max-w-md">
        <button class="btn btn-secondary">Change Password</button>
      </div>
    </div>
  </div>

  <!-- Modules -->
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/navigation.js"></script>
  
  <script type="module">
    import { setupAuthListener, getUserProfile } from './js/auth.js';
    import { formatCurrency } from './js/config.js';
    
    setupAuthListener(async (user) => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      
      const profile = await getUserProfile(user.uid);
      if (profile) {
        const nameEl = document.getElementById('profileName');
        if (nameEl) nameEl.textContent = profile.displayName || profile.username;
        const uEl = document.getElementById('profileUsername');
        if (uEl) uEl.textContent = profile.username;
        const eEl = document.getElementById('profileEmail');
        if (eEl) eEl.textContent = profile.email;
        const pEl = document.getElementById('profilePhone');
        if (pEl) pEl.textContent = profile.phone || 'Not set';
        const avEl = document.getElementById('profileAvatar');
        if (avEl) avEl.textContent = (profile.username || 'U').charAt(0).toUpperCase();
        const stEl = document.getElementById('profileStatus');
        if (stEl) stEl.textContent = profile.status || 'ACTIVE';
      }
    });
  </script>
</body>
</html>
