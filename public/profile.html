<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - EARNWAVE</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container">
    <h2 class="mb-4">My Profile</h2>
    
    <div class="card mb-4">
      <div class="d-flex align-items-center flex-wrap" style="gap: 2rem;">
        <div class="avatar" style="width: 100px; height: 100px; font-size: 2.5rem;" id="profileAvatar">U</div>
        <div style="flex: 1;">
          <div class="d-flex align-items-center mb-2">
            <h3 style="margin: 0; margin-right: 1rem;" id="profileName">Loading...</h3>
            <span class="badge badge-success" id="profileStatus">ACTIVE</span>
          </div>
          <p class="text-secondary mb-1">@<span id="profileUsername">...</span></p>
          <p class="text-secondary mb-1">📧 <span id="profileEmail">...</span></p>
          <p class="text-secondary mb-3">📱 <span id="profilePhone">...</span></p>
          <button class="btn btn-secondary btn-sm">Edit Profile</button>
        </div>
      </div>
    </div>

    <div class="d-flex" style="gap: 1.5rem; flex-wrap: wrap;">
      <div class="card flex-1" style="min-width: 250px;">
        <h4 class="text-secondary">Lifetime Earned</h4>
        <h2 class="mt-2 text-success" id="statEarned">KES 0.00</h2>
      </div>
      <div class="card flex-1" style="min-width: 250px;">
        <h4 class="text-secondary">Tasks Completed</h4>
        <h2 class="mt-2" id="statTasks">0</h2>
      </div>
      <div class="card flex-1" style="min-width: 250px;">
        <h4 class="text-secondary">Referral Earnings</h4>
        <h2 class="mt-2 text-warning" id="statReferrals">KES 0.00</h2>
      </div>
    </div>

    <div class="card mt-4">
      <h3 class="mb-4">Security</h3>
      <div class="form-group max-w-md">
        <button class="btn btn-secondary">Change Password</button>
      </div>
    </div>
  </div>

  <!-- Modules -->
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/navigation.js"></script>
  
  <script type="module">
    import { setupAuthListener, getUserProfile } from './js/auth.js';
    import { formatCurrency } from './js/config.js';
    
    setupAuthListener(async (user) => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      
      const profile = await getUserProfile(user.uid);
      if (profile) {
        document.getElementById('profileName').textContent = profile.displayName || profile.username;
        document.getElementById('profileUsername').textContent = profile.username;
        document.getElementById('profileEmail').textContent = profile.email;
        document.getElementById('profilePhone').textContent = profile.phone || 'Not set';
        document.getElementById('profileAvatar').textContent = profile.username.charAt(0).toUpperCase();
        document.getElementById('profileStatus').textContent = profile.status;
      }
    });
  </script>
</body>
</html>
