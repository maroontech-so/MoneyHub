<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - PesaWave</title>
    <style>
        :root {
            --bg-dark: #0d1117; --bg-card: #161b22; --accent-green: #00ff88;
            --accent-cyan: #00d4aa; --text-main: #c9d1d9; --text-muted: #8b949e;
            --border-color: #30363d; --danger: #f85149;
            --font-family: -apple-system, sans-serif;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-family); margin: 0; padding-bottom: 70px; }
        header { display: flex; align-items: center; padding: 16px 20px; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        .back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; margin-right: 16px; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        header h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .filters { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 16px; scrollbar-width: none; padding-bottom: 4px; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 16px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
        .filter-chip.active { background-color: rgba(0, 255, 136, 0.1); border-color: var(--accent-green); color: var(--accent-green); }

        .search-bar { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; margin-bottom: 20px; width: 100%; box-sizing: border-box; color: var(--text-main); outline: none; }
        .search-bar:focus { border-color: var(--accent-cyan); }

        .tx-list { display: flex; flex-direction: column; gap: 12px; }
        .tx-item { display: flex; align-items: center; padding: 12px; background-color: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); }
        .tx-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; }
        .tx-icon.in { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); }
        .tx-icon.out { background-color: rgba(248, 81, 73, 0.1); color: var(--danger); }
        .tx-details { flex: 1; min-width: 0; }
        .tx-title { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tx-date { font-size: 0.75rem; color: var(--text-muted); }
        .tx-ref { font-size: 0.7rem; color: var(--text-muted); font-family: monospace; }
        .tx-amount { text-align: right; margin-left: 12px; }
        .tx-value { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
        .tx-value.positive { color: var(--accent-green); }
        .tx-value.negative { color: var(--text-main); }
        .tx-status { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .tx-status.completed { background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); }
        .tx-status.pending { background-color: rgba(255, 171, 0, 0.1); color: #ffab00; }
        .tx-status.failed { background-color: rgba(248, 81, 73, 0.1); color: var(--danger); }

        .load-more { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; margin-top: 20px; cursor: pointer; display: none; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); display: none; }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1>Transactions</h1>
    </header>
    <div class="container">
        <input type="text" class="search-bar" id="tx-search" placeholder="Search transactions...">
        <div class="filters">
            <div class="filter-chip active" data-filter="all">All</div>
            <div class="filter-chip" data-filter="in">Money In</div>
            <div class="filter-chip" data-filter="out">Money Out</div>
            <div class="filter-chip" data-filter="pending">Pending</div>
        </div>
        <div class="tx-list" id="tx-list">
            <!-- Populated by JS -->
        </div>
        <div class="empty-state" id="tx-empty">
            <p>No transactions found.</p>
        </div>
        <button class="load-more" id="load-more-btn">Load More</button>
    </div>
    <script type="module" src="./js/transactions.js"></script>
</body>
</html>
