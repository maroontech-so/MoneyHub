<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - PesaWave</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .tab { background: #374151; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #00d4aa; color: #0d1117; }
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin-bottom: 40px; margin-top: 40px; height: 200px; }
        .podium-item { display: flex; flex-direction: column; align-items: center; width: 120px; background: #1f2937; border-top-left-radius: 10px; border-top-right-radius: 10px; padding-top: 20px; position: relative; }
        .podium-item.rank-1 { height: 180px; background: linear-gradient(to top, #1f2937, rgba(255, 215, 0, 0.2)); border: 1px solid #ffd700; border-bottom: none; }
        .podium-item.rank-2 { height: 140px; background: linear-gradient(to top, #1f2937, rgba(192, 192, 192, 0.2)); border: 1px solid #c0c0c0; border-bottom: none; }
        .podium-item.rank-3 { height: 120px; background: linear-gradient(to top, #1f2937, rgba(205, 127, 50, 0.2)); border: 1px solid #cd7f32; border-bottom: none; }
        .podium-avatar { width: 60px; height: 60px; border-radius: 50%; position: absolute; top: -30px; border: 3px solid #111827; }
        .podium-rank { font-size: 2rem; font-weight: bold; color: #fff; opacity: 0.5; margin-top: 10px; }
        .podium-name { font-weight: bold; margin-top: auto; color: #fff; font-size: 0.9rem; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
        .podium-earnings { color: #00d4aa; font-weight: bold; padding-bottom: 15px; }
        
        .leaderboard-list { background: #1f2937; border-radius: 10px; overflow: hidden; }
        .list-item { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #374151; }
        .list-item:last-child { border-bottom: none; }
        .item-rank { width: 40px; font-weight: bold; color: #9ca3af; }
        .item-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; }
        .item-name { flex-grow: 1; font-weight: bold; color: #fff; }
        .item-earnings { font-weight: bold; color: #00d4aa; }
        .item-change { margin-left: 15px; width: 20px; text-align: center; }
        .up { color: #4ade80; }
        .down { color: #ef4444; }
        .neutral { color: #9ca3af; }
        
        .sticky-user { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; padding: 15px; border-top: 1px solid #374151; z-index: 100; box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1); }
        .sticky-user-content { max-width: 800px; margin: 0 auto; display: flex; align-items: center; }
        
        .disclaimer { text-align: center; color: #9ca3af; font-size: 0.85rem; margin-top: 30px; margin-bottom: 80px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Leaderboard</h1>
            <nav>
                <a href="/dashboard.html">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="tabs">
            <button class="tab active" data-period="daily">Daily</button>
            <button class="tab" data-period="weekly">Weekly</button>
            <button class="tab" data-period="monthly">Monthly</button>
            <button class="tab" data-period="allTime">All Time</button>
        </div>

        <div class="podium" id="podiumContainer">
            <!-- Populated via JS -->
        </div>

        <div class="leaderboard-list" id="leaderboardList">
            <div style="text-align:center; padding: 20px; color:#9ca3af;">Loading rankings...</div>
        </div>

        <div class="disclaimer">
            Note: Rankings are based on verified, approved earnings only. Pending amounts do not count.
        </div>
    </main>

    <div class="sticky-user" id="stickyUser" style="display: none;">
        <div class="sticky-user-content list-item" style="border:none; padding:0;">
            <div class="item-rank" id="myRank">--</div>
            <img src="/assets/default-avatar.png" alt="You" class="item-avatar">
            <div class="item-name">You</div>
            <div class="item-earnings" id="myEarnings">KES 0</div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from '/js/firebase-init.js';
        import { collection, query, where, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        async function loadLeaderboard(period) {
            const list = document.getElementById('leaderboardList');
            const podium = document.getElementById('podiumContainer');
            list.innerHTML = '<div style="text-align:center; padding: 20px; color:#9ca3af;">Loading rankings...</div>';
            podium.innerHTML = '';

            try {
                const q = query(
                    collection(db, 'leaderboardEntries'),
                    where('period', '==', period),
                    orderBy('verifiedEarnings', 'desc'),
                    limit(50)
                );
                
                const snap = await getDocs(q);
                let entries = snap.docs.map(doc => doc.data());
                
                if (entries.length === 0) {
                    list.innerHTML = '<div style="text-align:center; padding: 20px; color:#9ca3af;">No data for this period yet.</div>';
                    return;
                }

                // Render podium (Top 3)
                const top3 = entries.slice(0, 3);
                // Order for display: 2, 1, 3
                const displayOrder = [];
                if (top3[1]) displayOrder.push({ ...top3[1], rank: 2 });
                if (top3[0]) displayOrder.push({ ...top3[0], rank: 1 });
                if (top3[2]) displayOrder.push({ ...top3[2], rank: 3 });

                displayOrder.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `podium-item rank-${item.rank}`;
                    const maskedName = item.username ? (item.username.substring(0,3) + '***') : 'User***';
                    div.innerHTML = `
                        <img src="${item.avatar || '/assets/default-avatar.png'}" class="podium-avatar" alt="Avatar">
                        <div class="podium-rank">${item.rank}</div>
                        <div class="podium-name">${maskedName}</div>
                        <div class="podium-earnings">KES ${item.verifiedEarnings}</div>
                    `;
                    podium.appendChild(div);
                });

                // Render rest of list
                list.innerHTML = '';
                entries.forEach((item, index) => {
                    if (index < 3) return; // Skip top 3
                    const rank = index + 1;
                    const maskedName = item.username ? (item.username.substring(0,3) + '***') : 'User***';
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    
                    let changeIcon = '<span class="item-change neutral">-</span>';
                    if (item.rankChange > 0) changeIcon = '<span class="item-change up">↑</span>';
                    if (item.rankChange < 0) changeIcon = '<span class="item-change down">↓</span>';

                    div.innerHTML = `
                        <div class="item-rank">#${rank}</div>
                        <img src="${item.avatar || '/assets/default-avatar.png'}" class="item-avatar">
                        <div class="item-name">${maskedName}</div>
                        <div class="item-earnings">KES ${item.verifiedEarnings}</div>
                        ${changeIcon}
                    `;
                    list.appendChild(div);
                });

                // Check user's rank
                if (auth.currentUser) {
                    const myEntry = entries.findIndex(e => e.userId === auth.currentUser.uid);
                    const sticky = document.getElementById('stickyUser');
                    const rankEl = document.getElementById('myRank');
                    const earnEl = document.getElementById('myEarnings');
                    if (myEntry >= 0) {
                        if (sticky) sticky.style.display = myEntry > 9 ? 'block' : 'none';
                        if (rankEl) rankEl.textContent = `#${myEntry + 1}`;
                        if (earnEl) earnEl.textContent = `KES ${entries[myEntry].verifiedEarnings}`;
                    } else {
                        if (sticky) sticky.style.display = 'block';
                        if (rankEl) rankEl.textContent = '--';
                        // Fetch my specific earnings ideally, for now just show 0
                    }
                }

            } catch (err) {
                console.error("Error loading leaderboard:", err);
                list.innerHTML = '<div style="text-align:center; padding: 20px; color:#ef4444;">Failed to load leaderboard.</div>';
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                loadLeaderboard(e.target.dataset.period);
            });
        });

        // Initial load
        auth.onAuthStateChanged(user => {
            loadLeaderboard('daily');
        });
    </script>
</body>
</html>
