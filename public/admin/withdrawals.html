<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Withdrawals - EARNWAVE</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module" src="../js/admin.js" defer></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="brand">EARNWAVE Admin</div>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="users.html">Users</a>
                <a href="withdrawals.html" class="active">Withdrawals</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="settings.html">Settings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h2>Manage Withdrawals</h2>
            </header>

            <div class="stats-row">
                <div class="stat-box">Total Pending: <strong id="sum-pending">0</strong></div>
                <div class="stat-box">Total Processing: <strong id="sum-processing">0</strong></div>
                <div class="stat-box">Total Today: <strong id="sum-today">KES 0</strong></div>
            </div>

            <div class="controls-bar">
                <select id="wd-status-filter">
                    <option value="ALL">All Statuses</option>
                    <option value="REQUESTED">Pending (Requested)</option>
                    <option value="PROCESSING">Processing</option>
                    <option value="SUBMITTED">Submitted</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="FAILED">Failed</option>
                </select>
                <button class="btn btn-secondary" id="btn-export-wd">Export CSV</button>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>User</th>
                        <th>Phone</th>
                        <th>Amount</th>
                        <th>Fee</th>
                        <th>Net</th>
                        <th>Status</th>
                        <th>Flags</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-withdrawals-tbody">
                    <tr><td colspan="9">Loading...</td></tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
