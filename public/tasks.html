<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - PesaWave</title>
    <style>
        :root { --bg-dark: #0d1117; --bg-card: #161b22; --accent-green: #00ff88; --accent-cyan: #00d4aa; --text-main: #c9d1d9; --text-muted: #8b949e; --border-color: #30363d; --danger: #f85149; --font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-family); margin: 0; padding-bottom: 70px; }
        header { padding: 16px 20px; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
        header h1 { font-size: 1.2rem; margin: 0 0 12px 0; font-weight: 600; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .filters { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 6px 16px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
        .filter-chip.active { background-color: rgba(0, 255, 136, 0.1); border-color: var(--accent-green); color: var(--accent-green); }

        .task-list { display: flex; flex-direction: column; gap: 16px; }
        .task-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .task-title { font-size: 1rem; font-weight: 600; margin: 0; }
        .task-reward { font-weight: 700; color: var(--accent-green); }
        .task-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .task-meta { display: flex; gap: 12px; font-size: 0.75rem; margin-bottom: 16px; }
        .meta-item { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; }
        
        .task-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .unlock-fee { font-size: 0.8rem; color: var(--accent-cyan); }
        .btn-view { background-color: var(--accent-green); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; gap: 4px; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>
    <header>
        <h1>Tasks</h1>
        <div class="filters">
            <div class="filter-chip active" data-filter="all">All</div>
            <div class="filter-chip" data-filter="available">Available</div>
            <div class="filter-chip" data-filter="progress">In Progress</div>
            <div class="filter-chip" data-filter="completed">Completed</div>
        </div>
        <div class="filters" style="margin-bottom: 0;">
            <div class="filter-chip active" data-diff="all">Any Difficulty</div>
            <div class="filter-chip" data-diff="easy">Easy</div>
            <div class="filter-chip" data-diff="medium">Medium</div>
            <div class="filter-chip" data-diff="hard">Hard</div>
        </div>
    </header>

    <div class="container">
        <div class="task-list" id="task-list">
            <!-- Populated by JS -->
        </div>
        <div class="empty-state" id="task-empty" style="display:none;">
            No tasks available right now. Check back soon.
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </a>
        <a href="tasks.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v3h-2v-3H8v-2h3v-3h2v3h3v2zm-3-7V3.5L18.5 9H13z"/></svg>
            Tasks
        </a>
        <a href="wallet.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Wallet
        </a>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </a>
    </nav>
    <script type="module" src="./js/tasks-page.js"></script>
</body>
</html>
