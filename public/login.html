<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PesaWave</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: var(--shadow-card);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <div class="logo-container">
        <a href="/index.html" style="text-decoration:none; display:inline-flex; flex-direction:column; align-items:center; gap:0.5rem;">
          <img src="/logo.png" alt="PesaWave Logo" style="height:68px; width:auto; max-width:200px; object-fit:contain; border-radius:12px; margin-bottom:0.25rem;">
          <div class="logo">PesaWave</div>
        </a>
        <p class="text-secondary mt-1">Welcome back. Enter your account credentials.</p>
      </div>
      
      <form id="loginForm">
        <div id="globalError" class="form-error text-center mb-4" style="display:none; color:var(--danger); background:rgba(248,81,73,0.1); padding:0.75rem; border-radius:6px; font-size:0.88rem;"></div>
        
        <div class="form-group mb-3">
          <label class="form-label" for="identifier" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Email Address</label>
          <input type="email" id="identifier" class="form-control" required placeholder="you@example.com" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>
        
        <div class="form-group mb-4">
          <label class="form-label" for="password" style="display:block; margin-bottom:0.35rem; font-size:0.85rem; color:var(--text-secondary);">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Enter password" style="width:100%; padding:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--input-bg); color:var(--text-primary);">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding:0.85rem; font-size:1rem; font-weight:600; cursor:pointer;" id="loginBtn">
          <span class="btn-text">Log In</span>
          <div class="spinner hidden" id="loginSpinner" style="display:none;">Logging in...</div>
        </button>
      </form>
      
      <div class="text-center mt-4" style="margin-top:1.5rem; text-align:center; font-size:0.9rem;">
        <span class="text-secondary">Don't have an account?</span>
        <a href="/register.html" style="color:var(--accent-green); font-weight:600; text-decoration:none; margin-left:0.25rem;">Create Account</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { loginUser, setupAuthListener, checkUserActivation } from './js/auth.js';
    
    // Check if already authenticated
    setupAuthListener(async (user) => {
      if (user) {
        const isActivated = await checkUserActivation(user.uid);
        if (!isActivated) {
          window.location.href = '/activation.html';
        } else {
          window.location.href = '/index.html';
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      
      const btnText = document.querySelector('.btn-text');
      const spinner = document.getElementById('loginSpinner');
      const errorDiv = document.getElementById('globalError');
      const submitBtn = document.getElementById('loginBtn');
      
      if (btnText) btnText.style.display = 'none';
      if (spinner) spinner.style.display = 'inline-block';
      if (errorDiv) errorDiv.style.display = 'none';
      if (submitBtn) submitBtn.disabled = true;
      
      try {
        const user = await loginUser(identifier, password);
        const isActivated = await checkUserActivation(user.uid);
        if (!isActivated) {
          window.location.href = '/activation.html';
        } else {
          window.location.href = '/index.html';
        }
      } catch (err) {
        if (errorDiv) {
          errorDiv.textContent = err.message || 'Login failed. Please check your email and password.';
          errorDiv.style.display = 'block';
        }
        if (btnText) btnText.style.display = 'inline-block';
        if (spinner) spinner.style.display = 'none';
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
