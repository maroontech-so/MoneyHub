<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EARNWAVE</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <div class="logo-container">
        <div class="logo">EARNWAVE</div>
        <p class="text-secondary mt-1">Welcome back</p>
      </div>
      
      <form id="loginForm">
        <div id="globalError" class="form-error text-center mb-4"></div>
        
        <div class="form-group">
          <label class="form-label" for="identifier">Email or Username</label>
          <input type="text" id="identifier" class="form-control" required placeholder="Enter email or username">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Enter password">
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <label style="font-size: 0.875rem; color: var(--text-secondary);">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" id="forgotPassword" style="font-size: 0.875rem;">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%" id="loginBtn">
          <span class="btn-text">Log In</span>
          <div class="spinner hidden" id="loginSpinner"></div>
        </button>
      </form>
      
      <div class="text-center mt-4">
        <span class="text-secondary">Don't have an account?</span>
        <a href="/register.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { loginUser, setupAuthListener } from './js/auth.js';
    
    // Redirect if already logged in
    setupAuthListener((user) => {
      if (user) window.location.href = '/dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      
      const btnText = document.querySelector('.btn-text');
      const spinner = document.getElementById('loginSpinner');
      const errorDiv = document.getElementById('globalError');
      
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      errorDiv.style.display = 'none';
      
      try {
        await loginUser(identifier, password);
        // Auth listener will handle redirect
      } catch (err) {
        errorDiv.textContent = err.message || 'Login failed. Please check your credentials.';
        errorDiv.style.display = 'block';
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
