<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Products | PesaWave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
    <!-- Add your firebase config script here -->
    <script src="js/payments.js"></script>
    <script src="js/products.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Digital Marketplace</h1>
            <div class="w-1/3">
                <input type="text" placeholder="Search products..." class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex gap-4 overflow-x-auto pb-2" id="category-filters">
            <button class="px-4 py-2 rounded-full bg-blue-600 text-white font-medium" data-cat="All">All</button>
            <button class="px-4 py-2 rounded-full bg-white text-gray-700 border hover:bg-gray-50 font-medium" data-cat="eBooks">eBooks</button>
            <button class="px-4 py-2 rounded-full bg-white text-gray-700 border hover:bg-gray-50 font-medium" data-cat="Templates">Templates</button>
            <button class="px-4 py-2 rounded-full bg-white text-gray-700 border hover:bg-gray-50 font-medium" data-cat="Courses">Courses</button>
            <button class="px-4 py-2 rounded-full bg-white text-gray-700 border hover:bg-gray-50 font-medium" data-cat="Tools">Tools</button>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Loading Skeleton -->
            <div class="bg-white rounded-lg shadow-sm border p-4 animate-pulse">
                <div class="h-48 bg-gray-200 rounded-md mb-4"></div>
                <div class="h-4 bg-gray-200 w-1/4 rounded mb-2"></div>
                <div class="h-6 bg-gray-200 w-3/4 rounded mb-4"></div>
                <div class="h-4 bg-gray-200 w-full rounded mb-1"></div>
                <div class="h-4 bg-gray-200 w-2/3 rounded mb-4"></div>
                <div class="flex justify-between items-center">
                    <div class="h-6 bg-gray-200 w-1/3 rounded"></div>
                    <div class="h-8 bg-gray-200 w-1/3 rounded"></div>
                </div>
            </div>
        </div>
        
        <div id="empty-state" class="hidden text-center py-12">
            <p class="text-gray-500 text-lg">No products found in this category.</p>
        </div>
    </main>

    <script>
        async function renderProducts(category = 'All') {
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');
            
            // Basic UI reset
            empty.classList.add('hidden');
            
            try {
                // In a real implementation this waits for auth state
                const productList = await window.products.loadProducts({ category });
                
                grid.innerHTML = '';
                if (productList.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }

                for (const p of productList) {
                    const hasAccess = await window.products.checkProductAccess(p.id);
                    
                    const actionBtn = hasAccess 
                        ? `<button onclick="downloadProduct('${p.id}')" class="bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200 text-sm font-medium">Download</button>`
                        : `<button onclick="window.location.href='product.html?id=${p.id}'" class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 text-sm font-medium">Buy Now</button>`;

                    grid.innerHTML += `
                        <div class="bg-white rounded-lg shadow-sm border overflow-hidden hover:shadow-md transition">
                            <img src="${p.coverImage || 'https://via.placeholder.com/400x300'}" alt="${p.title}" class="w-full h-48 object-cover" loading="lazy">
                            <div class="p-4">
                                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">${p.category}</span>
                                <h3 class="text-lg font-bold text-gray-900 mt-1 line-clamp-1">${p.title}</h3>
                                <p class="text-sm text-gray-500 mt-2 line-clamp-2">${p.description}</p>
                                <div class="mt-4 flex items-center justify-between">
                                    <span class="text-lg font-bold text-gray-900">KES ${p.price}</span>
                                    ${actionBtn}
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<p class="text-red-500">Failed to load products.</p>';
            }
        }

        async function downloadProduct(id) {
            try {
                const url = await window.products.getProductDownloadUrl(id);
                window.open(url, '_blank');
            } catch(e) {
                alert('Error downloading: ' + e.message);
            }
        }

        document.getElementById('category-filters').addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON') {
                document.querySelectorAll('#category-filters button').forEach(b => {
                    b.className = 'px-4 py-2 rounded-full bg-white text-gray-700 border hover:bg-gray-50 font-medium';
                });
                e.target.className = 'px-4 py-2 rounded-full bg-blue-600 text-white font-medium';
                renderProducts(e.target.getAttribute('data-cat'));
            }
        });

        // Initialize (timeout to allow firebase init in real app)
        setTimeout(() => renderProducts(), 1000);
    </script>
</body>
</html>
