<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - EARNWAVE</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --accent-green: #00ff88;
            --accent-cyan: #00d4aa;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --danger: #f85149;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 4px;
            margin-right: 16px;
        }
        
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
        
        header h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }

        /* Wallet Hero */
        .wallet-hero {
            text-align: center;
            padding: 32px 20px;
            background: linear-gradient(135deg, #0d221c, #091a22);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .hero-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
        .hero-amount { font-size: 2.5rem; font-weight: 700; color: white; margin-bottom: 8px; }
        .hero-pending { font-size: 0.9rem; color: var(--accent-cyan); }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-primary { background-color: var(--accent-green); color: #000; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn:active { opacity: 0.8; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .stat-val { font-size: 1.2rem; font-weight: 600; color: var(--text-main); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; gap: 4px; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1>Wallet</h1>
    </header>

    <div class="container">
        <div class="wallet-hero">
            <div class="hero-label">Available Balance</div>
            <div class="hero-amount" id="wallet-balance">KES ---.--</div>
            <div class="hero-pending" id="wallet-pending">Pending: KES ---.--</div>
        </div>

        <div class="action-row">
            <button class="btn btn-primary" onclick="alert('Withdraw flow')">Withdraw</button>
            <button class="btn btn-outline" onclick="window.location.href='transactions.html'">History</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">Total Earned</div>
                <div class="stat-val" id="wallet-earned">KES ---.--</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Total Withdrawn</div>
                <div class="stat-val" id="wallet-withdrawn">KES ---.--</div>
            </div>
        </div>
        
        <button class="btn btn-outline" style="width: 100%; margin-bottom: 20px;" onclick="window.location.href='transactions.html'">View All Transactions</button>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </a>
        <a href="tasks.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v3h-2v-3H8v-2h3v-3h2v3h3v2zm-3-7V3.5L18.5 9H13z"/></svg>
            Tasks
        </a>
        <a href="wallet.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Wallet
        </a>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </a>
    </nav>
    <script type="module" src="./js/wallet-page.js"></script>
</body>
</html>
